    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:#100d16;color:#fff;font-family:Inter,system-ui,sans-serif}.backdrop{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 20%,#a246f84a,transparent 33%),radial-gradient(circle at 80% 72%,#e05dba45,transparent 36%),linear-gradient(130deg,#15101e,#261632 48%,#110d18)}.orb{position:fixed;width:38vw;aspect-ratio:1;border-radius:50%;filter:blur(70px);opacity:.52;z-index:-1;background:#d35fd7;left:-9vw;bottom:-14vw;animation:float 12s ease-in-out infinite alternate}.orb.two{background:#526bf2;left:auto;bottom:auto;right:-11vw;top:-10vw;animation-delay:-4s}@keyframes float{to{transform:translate(8vw,-5vw) scale(1.13)}}.profile{width:min(480px,calc(100% - 34px));margin:10vh auto 44px;text-align:center;padding:34px 26px 26px;border:1px solid #fff3;border-radius:23px;background:#16111ed4;box-shadow:0 30px 90px #000a;backdrop-filter:blur(18px)}.avatar{width:106px;height:106px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;border:2px solid #ffffffa8;background:linear-gradient(145deg,#d86ab5,#673cbb 52%,#27204f);font:700 43px "DM Mono";box-shadow:0 0 0 6px #ffffff12,0 0 40px #d368e899}.name{margin:0;font-size:28px;letter-spacing:-1px}.verified{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;border-radius:50%;background:#74a8ff;color:#fff;font-size:11px;vertical-align:3px}.handle{margin:8px 0 19px;color:#d3c8da;font:13px "DM Mono"}.bio{max-width:310px;margin:0 auto 23px;color:#f3eaf4;font-size:14px;line-height:1.55}.badge{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border:1px solid #fff3;border-radius:999px;background:#ffffff12;color:#e7daec;font:12px "DM Mono"}.dot{width:7px;height:7px;border-radius:50%;background:#7df45f;box-shadow:0 0 10px #7df45f}.links{display:grid;gap:10px;margin-top:25px}.link{display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;border:1px solid #fff3;border-radius:12px;background:#ffffff12;color:#fff;text-decoration:none;font-size:14px;transition:.2s}.link:hover{transform:translateY(-2px);background:#ffffff20;border-color:#fff8}.icon{width:21px;text-align:center}.footer{margin-top:24px;color:#bcaec4;font:11px "DM Mono"}.enter{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#0b0810e8;backdrop-filter:blur(12px);transition:opacity .45s,visibility .45s}.enter.hidden{opacity:0;visibility:hidden}.enterbox{text-align:center;padding:26px}.enter h2{margin:0;font-size:22px;letter-spacing:-.5px}.enter p{max-width:350px;margin:12px auto 18px;color:#cbc1d0;font-size:10px;line-height:1.5}.enter button{border:1px solid #fff6;border-radius:11px;padding:12px 22px;background:linear-gradient(135deg,#e575c8,#795ee3);box-shadow:0 9px 35px #b24cd66b;color:#fff;font:600 14px Inter;cursor:pointer}.status{position:fixed;bottom:16px;left:50%;z-index:4;transform:translateX(-50%);padding:9px 13px;border-radius:8px;background:#1c1524;color:#f3e5f4;border:1px solid #fff3;font-size:12px;opacity:0;transition:.25s}.status.show{opacity:1}@media(max-width:520px){.profile{margin-top:7vh;padding:29px 18px 21px}.avatar{width:94px;height:94px}.name{font-size:26px}}

<body><div class="backdrop"></div><div class="orb"></div><div class="orb two"></div><main class="profile"><div class="avatar">P</div><h1 class="name">puerco <span class="verified">✓</span></h1><div class="handle">@puerco</div><p class="bio">un rincón personal · juegos · comunidad</p><div class="badge"><span class="dot"></span> disponible</div><nav class="links" aria-label="Enlaces"><a class="link" href="#discord"><span class="icon">◈</span> Discord</a><a class="link" href="#tiktok"><span class="icon">◉</span> TikTok</a><a class="link" href="#youtube"><span class="icon">▷</span> YouTube</a></nav><div class="footer">puerco · perfil personal</div></main><section class="enter" id="enter"><div class="enterbox"><h2>clic para entrar</h2><p>al entrar aceptas el uso de datos técnicos básicos, incluida la ip pública. ver detalles.</p><button id="continue" type="button">ENTRAR AL PERFIL</button></div></section><div class="status" id="status" role="status"></div><script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const cfg=window.APP_CONFIG||{},go=document.querySelector('#continue'),enter=document.querySelector('#enter'),status=document.querySelector('#status'),ready=cfg.supabaseUrl&&cfg.supabaseKey,db=ready?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey):null;function browser(){const u=navigator.userAgent;return{browser:/Edg\//.test(u)?'Microsoft Edge':/Firefox\//.test(u)?'Firefox':/Chrome\//.test(u)?'Google Chrome':/Safari\//.test(u)?'Safari':'Other browser',operating_system:/Windows/.test(u)?'Windows':/Android/.test(u)?'Android':/iPhone|iPad|iPod/.test(u)?'iOS':/Mac OS/.test(u)?'macOS':/Linux/.test(u)?'Linux':'Unknown'}}async function info(){let public_ip=null;try{const r=await fetch('https://api.ipify.org?format=json');if(r.ok)public_ip=(await r.json()).ip}catch{}const d=browser();return{public_ip,browser:d.browser,operating_system:d.operating_system,language:navigator.language||null,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||null,screen_resolution:`${screen.width}×${screen.height}`,referrer:document.referrer||null}}go.onclick=async()=>{go.disabled=true;go.textContent='ENTRANDO…';if(ready){const r=await db.from('contact_submissions').insert({full_name:'Visita de perfil',email:'no-email@example.invalid',message:'Acceso al perfil puerco tras aceptar el aviso.',...await info()});if(r.error){status.textContent='No se pudo guardar el acceso.';status.classList.add('show')}}enter.classList.add('hidden')};
</script></body></html>
